name: Deploy Orchestrator

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment.'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy_to_dev:
    if: ${{github.event_name == 'push' || inputs.environment == 'dev'}}
    uses: ./.github/workflows/deploy_to_dev.yml
    secrets: inherit
    with:
      environment: 'Manual || Push Action = dev'

  deploy_to_prod:
    if: inputs.environment == 'prod'
    uses: ./.github/workflows/deploy_to_prod.yml
    secrets: inherit
    with:
      environment: 'Manual triggered prod = prod'

