name: Deploy Orchestrator

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment.'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy_to_dev:
    if: github.event.inputs.environment == 'dev'
    uses: ./.github/workflows/deploy_to_dev.yml
    secrets: inherit
    with:
      environment: ${{inputs.environment}}

