name: Deploy Orchestrator

on:
  push:
    branches:
      - main  # Adjust this to your main branch name if different.

  workflow_dispatch: # Manual trigger with environment selection.
    inputs:
      environment:
        description: 'Environment.'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy_to_dev:
    strategy:
      matrix:
        environment: [ dev ]  # Define dev environment
    if: ${{ github.event.inputs.environment == matrix.environment }}
    uses: ./.github/workflows/deploy_to_dev.yml
    secrets: inherit
    with:
      workflow: ${{ github.event.inputs.environment }}

  deploy_to_prod:
    strategy:
      matrix:
        environment: [ prod ]  # Define prod environment
    if: ${{ github.event.inputs.environment == matrix.environment }}
    uses: ./.github/workflows/deploy_to_prod.yml
    secrets: inherit
    with:
      workflow: ${{ github.event.inputs.environment }}